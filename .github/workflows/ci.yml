name: ci

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential verilator python3

      - name: RTL lint
        run: make lint

      - name: RTL simulation
        run: make sim

      - name: console userspace tests
        run: make -C sw/console check

      - name: emulator tests
        run: make -C sw/nes test
