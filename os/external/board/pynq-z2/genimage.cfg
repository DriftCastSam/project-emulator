image boot.vfat {
	vfat {
		files = {
			"BOOT.BIN",
			"uImage",
			"system.dtb",
			"boot.scr"
		}
	}

	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
